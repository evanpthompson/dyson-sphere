# dyson-sphere service pipeline
#
# Follows the split described in consu/docs/09-application-delivery.md: a
# service pipeline builds, tests and publishes one service across no
# environments. It must never learn a hostname, a namespace or a cluster
# credential. Resolving what actually runs where is the environment pipeline's
# job, in consu-config.
#
# test -> build+push image -> scan -> propose a pin bump to consu-config

stages:
  - test
  - build
  - scan
  - propose

variables:
  GO_VERSION: "1.26"
  # Immutable, commit-pinned. `latest` is never deployed.
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# ---------------------------------------------------------------- test ------
test:
  stage: test
  image: golang:${GO_VERSION}-bookworm
  script:
    - go vet ./...
    - test -z "$(gofmt -l .)" || { echo "gofmt found unformatted files:"; gofmt -l .; exit 1; }
    - go test -race -cover ./...
  # Race detector needs cgo, which the release build deliberately does not use.
  variables:
    CGO_ENABLED: "1"

# --------------------------------------------------------------- build ------
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      docker build \
        --build-arg VERSION="$CI_COMMIT_SHORT_SHA" \
        --build-arg COMMIT="$CI_COMMIT_SHA" \
        --build-arg SERVICE_NAME=dyson-sphere \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    # Record the digest. A tag can be moved; a digest cannot, and pinning by
    # digest is where this should end up once the flow is proven.
    - docker inspect --format='{{index .RepoDigests 0}}' "$CI_REGISTRY_IMAGE:$IMAGE_TAG" | tee image-digest.txt
  artifacts:
    paths:
      - image-digest.txt
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------- scan ------
# Warns rather than blocks, per 09-application-delivery.md: the gate turns
# blocking when preprod arrives. A scanner that blocks before anyone has agreed
# what an acceptable finding looks like just gets disabled.
scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    # The image is in this project's private registry, and the trivy image has
    # no docker daemon to log into -- it pulls the manifest itself over HTTPS.
    # Without these it authenticates as nobody and gets DENIED, which is how
    # this job spent its first four runs reporting a scan it never performed.
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
  # No allow_failure. `--exit-code 0` already makes findings non-blocking, which
  # is the "warns rather than blocks" this job wants. allow_failure on top of it
  # also swallowed trivy *failing to run at all*, and a scan that could not run
  # is not a pass. Findings stay green; a broken scanner now goes red.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ------------------------------------------------------------- propose ------
# Opens a merge request against consu-config bumping the dev image pin. It
# proposes; it does not deploy. Argo CD is still the only thing that applies to
# a cluster.
#
# Requires a CI/CD variable CONSU_CONFIG_MR_TOKEN: a project access token on
# consu-config with `write_repository` and api scope, permitted to push
# branches and open MRs, but NOT to push to protected main. If it is absent the
# job skips loudly rather than failing the pipeline, so the build stays useful
# before the token exists.
propose:dev:
  stage: propose
  image: alpine:3.22
  # The digest recorded by `build`, not a tag this job resolves for itself.
  # Resolving a tag here would mean asking the registry a second time what
  # `:$IMAGE_TAG` points at, and a tag is exactly the thing that can point
  # somewhere else by then. Copying the artifact forward is the only spelling
  # in which "the pin is the image we just tested" is guaranteed.
  needs:
    - job: build
      artifacts: true
  variables:
    KUSTOMIZE_VERSION: "5.7.1"
    # SHA-256 of kustomize_v5.7.1_linux_amd64.tar.gz, paired with the version
    # above so CI never executes an unverified downloaded binary. Same practice
    # as consu-config's own pipeline.
    KUSTOMIZE_SHA256: "ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8"
  script:
    - |
      if [ -z "${CONSU_CONFIG_MR_TOKEN:-}" ]; then
        echo "CONSU_CONFIG_MR_TOKEN is not set -- skipping the pin bump."
        echo "Image is published at $CI_REGISTRY_IMAGE:$IMAGE_TAG."
        echo "Bump it by hand in consu-config/overlays/dev/dyson-sphere/kustomization.yaml."
        exit 0
      fi
    - apk add --no-cache git curl tar
    - |
      curl --fail --location --silent --show-error --output /tmp/kustomize.tar.gz \
        "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
      # `-c` on a file, not `--check` on stdin: alpine's sha256sum is BusyBox,
      # which has no GNU long options and exits 1 on `--check`. Never ran here
      # before -- the job early-exited on a missing token every time -- and it
      # failed the moment consu-config's identical line first executed.
      echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tar.gz" > /tmp/kustomize.sha256
      sha256sum -c /tmp/kustomize.sha256
      tar --extract --gzip --file /tmp/kustomize.tar.gz --directory /usr/local/bin kustomize
    - |
      # The artifact is the whole basis of the pin, so its absence is a failure,
      # not something to work around. Without it this job could still open a
      # perfectly plausible merge request pinning a tag -- which is the outcome
      # worth preventing, because nothing downstream would look wrong.
      test -s image-digest.txt || {
        echo "propose: refusing: image-digest.txt is missing or empty." >&2
        echo "  It is produced by the build job; without it there is no digest" >&2
        echo "  to pin, and pinning a tag instead would silently give up the" >&2
        echo "  guarantee the whole promotion path rests on." >&2
        exit 1
      }
      DIGEST="$(cut -d@ -f2 image-digest.txt)"
      case "$DIGEST" in
        sha256:[0-9a-f]*) ;;
        *) echo "propose: refusing: '$DIGEST' is not a sha256 digest" >&2; exit 1 ;;
      esac
      echo "Pinning dev to $DIGEST (tag $IMAGE_TAG)"
    - git config --global user.email "ci@dyson-sphere"
    - git config --global user.name "dyson-sphere CI"
    - git clone "https://oauth2:${CONSU_CONFIG_MR_TOKEN}@gitlab.com/navetoocool/consu-config.git" cfg
    - |
      cd cfg
      BRANCH="bump/dyson-sphere-${IMAGE_TAG}"
      git checkout -b "$BRANCH"
      cd overlays/dev/dyson-sphere
      kustomize edit set image "dyson-sphere=${CI_REGISTRY_IMAGE}@${DIGEST}"
      cd - >/dev/null
      git add overlays/dev/dyson-sphere/kustomization.yaml
      git commit -m "Bump dyson-sphere dev pin to ${DIGEST}" \
                 -m "Tag ${IMAGE_TAG}, digest recorded by this commit's build job. dev is where a digest enters the system; preprod and prod only ever copy this value forward."
      git push -o merge_request.create \
               -o merge_request.target=main \
               -o merge_request.title="Bump dyson-sphere dev pin to ${IMAGE_TAG}" \
               origin "$BRANCH"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
